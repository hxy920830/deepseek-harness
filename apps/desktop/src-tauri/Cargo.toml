[package]
name = "dsh-desktop"
version = "0.1.0-rc.5"
description = "Tauri 2 desktop shell for DeepSeek Harness"
edition = "2021"
license = "MIT"

[lib]
name = "dsh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "dsh-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
